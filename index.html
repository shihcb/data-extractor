<!DOCTYPE html>
<html lang="en" class="preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>toolbox</title>
    <meta name="description" content="Quick tools that run in your browser: case converter, image converter, PDF tools and editor, QR codes and text diff." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-maskable-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="toolbox" />

    <!-- Light/dark follows the device, set before the first paint (no flash),
         and the page draws once with transitions off (the .preload class). -->
    <script>
      (function () {
        var root = document.documentElement;
        var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        // Transitions off for a couple of frames (the .preload class): while
        // the page first draws, and whenever it comes back into view. iOS
        // flips light/dark while an app goes to the background (to take its
        // switcher snapshots); with transitions on, every colour then eased
        // back over 450ms as you returned, and the page seemed to flash.
        var still = 0;
        var quiet = function () {
          root.classList.add('preload');
          var mine = ++still;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { if (mine === still) root.classList.remove('preload'); });
          });
        };
        var apply = function () {
          var dark = !!(media && media.matches);
          var theme = dark ? 'dark' : 'light';
          if (root.getAttribute('data-theme') === theme) return;
          if (root.hasAttribute('data-theme')) quiet();
          root.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#faf9f6');
        };
        apply();
        if (media) {
          if (media.addEventListener) media.addEventListener('change', apply);
          else if (media.addListener) media.addListener(apply);
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') { quiet(); apply(); }
        });
        window.addEventListener('pageshow', function (e) { if (e.persisted) { quiet(); apply(); } });
        window.addEventListener('load', quiet);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
